<!--
  Purpose: User authentication page (sign in and registration forms with inline validation)
  AI-assisted (Antigravity) — reviewed by student
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — Banana Math Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="nav-brand" style="justify-content: center; margin-bottom: 0.75rem;">
          <span class="brand-icon">🍌</span>
          <span class="brand-text">Banana Math Quest</span>
        </a>
        <h1>Welcome Back</h1>
        <p>Sign in to track your scores or register to compete on the leaderboard.</p>
      </div>

      <!-- Alert / server notification banner -->
      <div id="auth-alert" class="alert hidden" role="alert"></div>

      <!-- Tab navigation -->
      <div class="auth-tabs" role="tablist">
        <button id="tab-login" class="tab-btn active" role="tab" aria-selected="true" type="button">
          Sign In
        </button>
        <button id="tab-register" class="tab-btn" role="tab" aria-selected="false" type="button">
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-identifier">Username or Email</label>
          <input
            type="text"
            id="login-identifier"
            name="identifier"
            class="form-input"
            placeholder="e.g. player1 or player@example.com"
            required
            autocomplete="username"
          />
          <span id="err-login-identifier" class="form-error-msg hidden"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password-btn"
              data-target="login-password"
              aria-label="Toggle password visibility"
              title="Show password"
            >
              👁️
            </button>
          </div>
          <span id="err-login-password" class="form-error-msg hidden"></span>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <!-- Registration Form (hidden by default) -->
      <form id="register-form" class="auth-form hidden" novalidate>
        <div class="form-group">
          <label for="register-username">Username</label>
          <input
            type="text"
            id="register-username"
            name="username"
            class="form-input"
            placeholder="Choose a player name (3-30 chars)"
            required
            minlength="3"
            maxlength="30"
            autocomplete="username"
          />
          <span id="err-register-username" class="form-error-msg hidden"></span>
        </div>

        <div class="form-group">
          <label for="register-email">Email Address</label>
          <input
            type="email"
            id="register-email"
            name="email"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
          <span id="err-register-email" class="form-error-msg hidden"></span>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="register-password"
              name="password"
              class="form-input"
              placeholder="At least 6 characters"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password-btn"
              data-target="register-password"
              aria-label="Toggle password visibility"
              title="Show password"
            >
              👁️
            </button>
          </div>
          <span id="err-register-password" class="form-error-msg hidden"></span>
        </div>

        <button type="submit" id="btn-register-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer-links">
        <a href="index.html">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
